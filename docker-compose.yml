version: '3.8'

services:
  # [Service 1] The Senses: 광부
  miner:
    build: 
      context: .
      target: miner
    container_name: topologos-miner
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    # [FIX] 경로 수정: tools/miner/miner.py -> tools/miner.py
    command: python3 tools/miner.py --daemon --rss "https://techcrunch.com/feed/" --interval 300
    restart: unless-stopped
    depends_on:
      - brain

  # [Service 2] The Brain: 엔진 (C++ Core)
  engine:
    build: 
      context: .
      target: engine
    container_name: topologos-engine
    volumes:
      - ./data:/app/data
      # [Tip] 개발 중에는 config를 바로 수정해서 반영되도록 마운트
      - ./config:/app/config 
    # [FIX] 빌드된 바이너리 실행 확인
    command: bash -c "while true; do ./build/TopoLogos config/life.topo; echo '[Engine] Cycle complete. Sleeping...'; sleep 60; done"
    restart: unless-stopped
    depends_on:
      - qdrant # DB가 켜져야 엔진이 돕니다

  # [Service 3] The Self: 대시보드
  dashboard:
    build: 
      context: .
      target: dashboard
    container_name: topologos-dashboard
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/data
    # [FIX] 경로 수정
    command: python3 tools/dashboard.py
    restart: unless-stopped

  # [Service 4] AI Brain (Ollama)
  brain:
    image: ollama/ollama:latest
    container_name: topologos-brain
    ports:
      # [FIX] 포트 충돌 방지: 호스트의 11435번을 컨테이너 11434로 연결
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  # [Service 5] Vector DB (Qdrant) - New!
  qdrant:
    image: qdrant/qdrant:latest
    container_name: topologos-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data: