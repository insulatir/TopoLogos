name: TopoLogos CI/CD

on:
  push:
    branches: [ "main" ]

# GHCR에 이미지를 저장하기 위한 권한 설정
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 여러 서비스를 한 번에 처리하기 위한 전략 (Miner, Engine, Dashboard)
    strategy:
      matrix:
        service: [miner, engine, dashboard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile  # 파일은 하나!
          target: ${{ matrix.service }} # [핵심] Dockerfile 내의 AS 이름을 찾아갑니다.
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/topologos-${{ matrix.service }}:latest