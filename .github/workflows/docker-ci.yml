name: TopoLogos CI/CD

on:
  push:
    branches: [ "main" ]

# GHCR에 이미지를 저장하기 위한 권한 설정
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 여러 서비스를 한 번에 처리하기 위한 전략 (Miner, Engine, Dashboard)
    strategy:
      matrix:
        service: [miner, engine, dashboard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. GitHub Container Registry에 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Docker 빌드 및 푸시
      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: .
          # 각 서비스의 Dockerfile 경로 지정
          file: ./tools/${{ matrix.service }}/Dockerfile
          push: true
          # 이미지 이름을 'ghcr.io/사용자명/프로젝트명-서비스명' 형태로 저장
          tags: |
            ghcr.io/${{ github.repository_owner }}/topologos-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/topologos-${{ matrix.service }}:${{ github.sha }}

      # 3. (옵션) 빌드 성공 후 결과 리포트
      - name: Build Summary
        run: echo "🚀 ${{ matrix.service }} image has been pushed to GHCR!"